name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Build (static export)
        run: npm run build

      - name: Verify export output
        run: |
          if [ ! -d "out" ]; then
            echo "::error::Static export directory 'out' was not created"
            exit 1
          fi
          echo "Static export successful: $(find out -name '*.html' | wc -l) HTML files generated"
